pre-commit:
  commands:
    format:
      glob: '*'
      run: npm run format:check
    typecheck:
      glob: '*'
      run: npm run typecheck -w @checkout/web
    build:
      glob: '*'
      run: npm run build -w @checkout/web
    lint:
      glob: '*'
      run: npm run lint -w @checkout/web
    test:
      glob: '*'
      run: npm run test -w @checkout/web
